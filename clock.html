<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock - US Central Time (Illinois)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .title {
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .clock-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* Clock numbers */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .number span {
            display: inline-block;
            padding-top: 20px;
            width: 100%;
        }

        /* Center dot */
        .center {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Hour hand */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
        }

        .hour {
            width: 8px;
            height: 100px;
            margin-left: -4px;
            background: #333;
            z-index: 6;
        }

        .minute {
            width: 6px;
            height: 140px;
            margin-left: -3px;
            background: #555;
            z-index: 7;
        }

        .second {
            width: 3px;
            height: 150px;
            margin-left: -1.5px;
            background: #e74c3c;
            z-index: 8;
        }

        /* Time display */
        .digital-time {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .timezone-info {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            text-align: center;
            margin-top: 10px;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .clock-wrapper {
                width: 300px;
                height: 300px;
            }

            .title {
                font-size: 1.8rem;
            }

            .hour {
                height: 75px;
            }

            .minute {
                height: 105px;
            }

            .second {
                height: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Central Time Clock</h1>
        
        <div class="clock-wrapper">
            <div class="clock">
                <!-- Clock numbers -->
                <div class="number" style="transform: rotate(0deg)"><span>12</span></div>
                <div class="number" style="transform: rotate(30deg)"><span style="transform: rotate(-30deg)">1</span></div>
                <div class="number" style="transform: rotate(60deg)"><span style="transform: rotate(-60deg)">2</span></div>
                <div class="number" style="transform: rotate(90deg)"><span style="transform: rotate(-90deg)">3</span></div>
                <div class="number" style="transform: rotate(120deg)"><span style="transform: rotate(-120deg)">4</span></div>
                <div class="number" style="transform: rotate(150deg)"><span style="transform: rotate(-150deg)">5</span></div>
                <div class="number" style="transform: rotate(180deg)"><span style="transform: rotate(180deg)">6</span></div>
                <div class="number" style="transform: rotate(210deg)"><span style="transform: rotate(-210deg)">7</span></div>
                <div class="number" style="transform: rotate(240deg)"><span style="transform: rotate(-240deg)">8</span></div>
                <div class="number" style="transform: rotate(270deg)"><span style="transform: rotate(-270deg)">9</span></div>
                <div class="number" style="transform: rotate(300deg)"><span style="transform: rotate(-300deg)">10</span></div>
                <div class="number" style="transform: rotate(330deg)"><span style="transform: rotate(-330deg)">11</span></div>

                <!-- Clock hands -->
                <div class="hand hour" id="hour"></div>
                <div class="hand minute" id="minute"></div>
                <div class="hand second" id="second"></div>

                <!-- Center dot -->
                <div class="center"></div>
            </div>
        </div>

        <div class="digital-time" id="digitalTime">00:00:00</div>
        <div class="timezone-info">Illinois - Central Time (CT)</div>
    </div>

    <script>
        function updateClock() {
            // Get current time in Illinois Central Time
            const now = new Date();
            const centralTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Chicago' }));

            // Get time components
            const hours = centralTime.getHours();
            const minutes = centralTime.getMinutes();
            const seconds = centralTime.getSeconds();
            const milliseconds = centralTime.getMilliseconds();

            // Calculate smooth rotations
            const secondDegrees = ((seconds + milliseconds / 1000) / 60) * 360;
            const minuteDegrees = ((minutes + seconds / 60) / 60) * 360;
            const hourDegrees = ((hours % 12 + minutes / 60) / 12) * 360;

            // Apply rotations
            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;

            // Update digital time display
            const formattedTime = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
            
            document.getElementById('digitalTime').textContent = formattedTime;

            // Update every 50ms for smooth animation
            requestAnimationFrame(updateClock);
        }

        // Start the clock
        updateClock();
    </script>
</body>
</html>
